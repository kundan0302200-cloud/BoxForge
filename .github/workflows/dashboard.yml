name: BoxForge Studio

on:
  push:
    branches: [main, "feat/boxforge-studio-dashboard"]
    paths:
      - "dashboard/**"
      - ".github/workflows/dashboard.yml"
  pull_request:
    paths:
      - "dashboard/**"
      - ".github/workflows/dashboard.yml"

jobs:
  dashboard-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build frontend
        working-directory: dashboard
        run: |
          npm install
          npm run build
      - name: Check API syntax
        run: python -m py_compile dashboard/api/server.py
